---
development:
  dialect: postgres
  database: todo_development
  user: postgres
  password: postgres
  host: {{envOr "DB_HOST" "127.0.0.1"}}
  port: {{envOr "DB_PORT" "5432"}}
  pool: 5

test:
  dialect: postgres
  database: todo_test
  user: postgres
  password: postgres
  host: {{envOr "DB_HOST" "127.0.0.1"}}
  port: {{envOr "DB_PORT" "5432"}}
  pool: 5

production:
  url: {{envOr "DATABASE_URL" "postgres://postgres:postgres@127.0.0.1:5432/todo_production?sslmode=disable"}}
